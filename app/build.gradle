plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nbaencolores.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nbaencolores.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmada con la llave de depuración para que se pueda instalar directo
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
