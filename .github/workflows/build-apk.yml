name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk NBA-en-Colores.apk

      - name: Subir APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: NBA-en-Colores-apk
          path: NBA-en-Colores.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NBA en Colores v1.0.${{ github.run_number }}
          body: "APK lista para instalar en Android. Descarga **NBA-en-Colores.apk** abajo."
          files: NBA-en-Colores.apk
